[project]
name = "goose-risk-guard-backend"
version = "0.1.0"
description = "鹅疫智答 - 行为事件驱动的 Agentic-RAG 多智能体风险研判后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "langgraph>=0.1",
    "langchain>=0.1",
    "llama-index>=0.10",
    "chromadb>=0.5",
    "networkx>=3.2",
    "python-louvain>=0.16",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "dashscope>=1.14",
    "pdfplumber>=0.10",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
